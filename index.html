.wrap{max-width:560px;margin:0 auto;padding:0 16px 44px}

.hero{margin:18px 0 10px}

.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}

.msg.bot .q{display:block;margin:4px 0;color:#2563eb}
.card{background:#fff;border:1px solid #e8eaee;border-radius:16px;padding:18px 16px;margin-top:10px}
.verdict{display:inline-block;font-size:16px;font-weight:700;padding:7px 18px;border-radius:999px;color:#fff}
.buy{background:#16a34a}.watch{background:#d97706}.skip{background:#dc2626}
.item-line{font-size:13px;color:#6b7280;margin-top:10px}
.comp-line{font-size:12px;color:#8a8f98;background:#f6f7f9;border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.6}

.price-hero .num{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:#111}
.price-hero .num small{font-size:14px;font-weight:500;color:#8a8f98}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.metric{background:#f6f7f9;border-radius:12px;padding:11px 13px}
.metric b{display:block;font-size:12px;color:#8a8f98;font-weight:400;margin-bottom:2px}
.metric span{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:#1a1a1a}
.dims{margin:8px 0}
.dim{margin:12px 0}
.dim .head{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#1a1a1a}
.dim .head i{font-style:normal;color:#2563eb;font-weight:600}
.dim .bar{height:6px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:7px 0 5px}
.dim .bar b{display:block;height:100%;background:#2563eb;border-radius:999px}
.dim .exp{font-size:12px;color:#8a8f98}
.section-title{font-size:14px;font-weight:600;margin:18px 0 8px;color:#1a1a1a}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:10px 13px;background:#f6f7f9;border-radius:10px;margin:6px 0;font-size:13px;line-height:1.6;color:#374151}
.risk-high{color:#dc2626;font-weight:600}.risk-medium{color:#d97706;font-weight:600}
.muted{color:#8a8f98;font-size:12px}
.link{color:#2563eb;cursor:pointer;font-size:13px}
.recform{background:#f6f7f9;border-radius:12px;padding:14px;margin-top:12px}
.recform .row{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.recform label{font-size:12px;color:#6b7280}
.recform input{border:1px solid #e3e6ea;border-radius:10px;padding:10px;font-size:14px;background:#fff;color:#1a1a1a}
.inputbar{display:flex;gap:8px;position:sticky;bottom:0;background:#f6f7f9;padding:10px 0 4px}
.inputbar input{flex:1;border:1px solid #e3e6ea;border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;color:#1a1a1a;min-width:0}
.inputbar input:focus{outline:none;border-color:#2563eb}
.inputbar .btn-send{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer}
.inputbar .mini{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:0 12px;font-size:13px;color:#4b5563;cursor:pointer;white-space:nowrap}
.demo-note{text-align:center;font-size:12px;color:#b3b7bd;margin-top:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid #e8eaee;border-radius:14px;padding:16px 12px;text-align:center}
.stat b{display:block;font-size:12px;color:#8a8f98;font-weight:400}
.stat span{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#1a1a1a}
.record{border:1px solid #e8eaee;border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}
.record .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.record .top b{font-size:13px;color:#1a1a1a;font-weight:600}
.mini-badge{font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:999px;white-space:nowrap}
.record .nums{font-size:12px;color:#6b7280;margin-top:6px;line-height:1.7;font-variant-numeric:tabular-nums}
.advanced{margin-top:36px;color:#9ca3af;font-size:12px;text-align:center}
.advanced summary{cursor:pointer;color:#9ca3af}
.advanced .adv-body{margin-top:10px;text-align:left}

<div class="top">
  <div class="topbar"><div class="name">收机参谋</div><button class="gear" onclick="toggleSettings()">设置</button></div>
  <div class="tag">二手 iPhone 收货决策工具</div>
</div>
<nav>
  <button id="nav1" class="active" onclick="showTab('t1')">评估</button>
  <button id="nav2" onclick="showTab('t2')">战绩</button>

<div class="wrap">
  <section id="t1">

    <div class="chips">
      <button class="chip" onclick="newEval('iPhone 13 128G 国行无锁 95新 电池90 无拆修 标价 1250 可小刀')">国行好价</button>
      <button class="chip" onclick="newEval('13 Pro 2800')">只给型号和价</button>
      <button class="chip" onclick="newEval('iPhone 13 128G 国行 有ID锁 忘记密码 标价 800')">带 ID 锁</button>
      <button class="chip" onclick="newEval('iPhone 13 Pro 128G 国行 95新 电池88 换过屏幕 标价 2100')">换过屏</button>
    </div>
    <div class="status" id="statusLine"></div>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <button class="mini" onclick="document.getElementById('imgIn').click()" title="上传截图识别">截图</button>
      <button class="mini" onclick="voiceInput()" title="语音输入">语音</button>
      <input id="chatInput" placeholder="说说这台机，比如：13 Pro 256G 国行无锁 电池90 95新 标价2800" onkeydown="if(event.key==='Enter')send()">
      <button class="btn-send" onclick="send()">发送</button>
      <input type="file" id="imgIn" accept="image/*" style="display:none" onchange="screenshotInput(this.files[0])">
    </div>
    <div class="demo-note">演示数据 · 对话引擎见右上角「设置」</div>
  </section>

  <section id="t2" style="display:none">
    <div class="hero"><h1>历史记录</h1><p>评估过的每台机，以及后来成交的情况。</p></div>
    <div class="statgrid" id="statGrid"></div>
    <div class="section-title">我评估过的机器</div>
    <div id="historyList"></div>
    <div class="section-title">预测价 vs 实际成交价</div>
    <div id="predActual"></div>
    <div class="section-title">最近成交</div>
    <div id="recList"></div>
  </section>

  <details class="advanced"><summary>高级：导入数据（JSON / CSV）</summary>
    <div class="adv-body">
      <div class="muted">候选样例 samples.json</div><input type="file" id="fSamples" accept=".json" onchange="importFile('samples')">
      <div class="muted">行情锚点 anchors.csv</div><input type="file" id="fAnchors" accept=".csv" onchange="importFile('anchors')">
      <div class="muted">知识库 knowledge.json</div><input type="file" id="fKnowledge" accept=".json" onchange="importFile('knowledge')"><div class="muted">历史案例 cases.json</div><input type="file" id="fCases" accept=".json" onchange="importFile('cases')">
      <div class="muted">导入后替换内置演示数据</div>
    </div>
  </details>
</div>

<div class="overlay" id="settingsOverlay" style="display:none" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <h3>设置</h3>
    <div class="opt"><label><input type="radio" name="mode" value="auto" checked> 自动（优先 AI，后端未配置时退回规则）</label></div>
    <div class="opt"><label><input type="radio" name="mode" value="rule"> 纯规则演示（完全本地，不联网）</label></div>
    <div class="field"><label>模型</label><input id="setModel" value="deepseek-chat"></div>
    <div class="muted">API Key 由服务端托管，你不需要输入，也不会暴露给访客。</div>
    <div style="margin-top:14px"><button class="btn-primary" style="width:100%;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600" onclick="saveSettings()">保存</button></div>
  </div>
</div>

function addCard(c){var d=document.createElement("div");d.className="msg bot";d.style.maxWidth="100%";var w=document.createElement("div");w.innerHTML=cardHTML(c);d.appendChild(w);$("chat").appendChild(d);scrollChat();}
function toggleRec(){var f=$("recForm");if(f)f.style.display=(f.style.display==="none")?"":"none";}
function saveRec(){if(!lastCard){return;}var sell=parseFloat($("rfSell").value);var buy=parseFloat($("rfBuy").value);var days=parseInt($("rfDays").value,10)||0;var note=$("rfNote").value.trim();if(!sell){alert("先填实际卖出价");return;}var pred=lastCard.expected_sell?lastCard.expected_sell.price_low:null;var hit;if(lastCard.verdict==="buy"){hit=buy>0?sell>buy:true;}else{hit=true;}records.push({model:(lastCard.item.model||"未识别")+(lastCard.item.storage?" "+lastCard.item.storage+"G":""),verdict:lastCard.verdict,pred:pred,actual:sell,buy:buy||0,days:days,hit:hit,note:note||"用户记录"});toggleRec();if(history.length){history[0].status="已卖出";history[0].sell=sell;history[0].buy=buy||0;history[0].days=days;}renderStats();renderHistory();}
function renderHistory(){var h="";history.forEach(function(x){var st=x.status||"已评估";h+='<div class="record"><div class="top"><b>'+esc(x.model||"未识别")+(x.storage?' '+x.storage+'G':'')+(x.listed?' · 标价 ¥'+fmt(x.listed):'')+'</b><span class="mini-badge '+V_CLS[x.verdict]+'">'+V_TEXT[x.verdict]+'</span></div><div class="nums">'+st+(x.sell?' · 卖出 ¥'+fmt(x.sell):'')+'</div></div>';});$("historyList").innerHTML=h||'<div class="muted">还没有评估记录</div>';}
function renderStats(){var n=records.length;var errs=records.filter(function(r){return r.actual>0&&r.pred>0;}).map(function(r){return Math.abs(r.pred-r.actual)/r.actual;});var avgErr=errs.length?(errs.reduce(function(a,b){return a+b;},0)/errs.length*100).toFixed(1):"—";var hits=records.filter(function(r){return r.hit===true;}).length;var hitRate=Math.round(hits/n*100);var days=records.filter(function(r){return r.days>0;}).map(function(r){return r.days;});var avgDays=days.length?Math.round(days.reduce(function(a,b){return a+b;},0)/days.length):"—";$("statGrid").innerHTML='<div class="stat"><b>累计单数</b><span>'+n+'</span></div><div class="stat"><b>平均报价误差</b><span>±'+avgErr+'%</span></div><div class="stat"><b>决策一致率</b><span>'+hitRate+'%</span></div><div class="stat"><b>平均出手天数</b><span>'+avgDays+' 天</span></div>';
var pa="";records.filter(function(r){return r.actual>0;}).forEach(function(r){var diff=r.pred>0?Math.round((r.actual-r.pred)/r.pred*100):0;pa+='<div class="record"><div class="top"><b>'+esc(r.model)+'</b><span class="mini-badge '+V_CLS[r.verdict]+'">'+V_TEXT[r.verdict]+'</span></div><div class="nums">预测 ¥'+fmt(r.pred)+' → 实际 ¥'+fmt(r.actual)+'（'+(diff>=0?"+":"")+diff+'%）</div></div>';});$("predActual").innerHTML=pa||'<div class="muted">还没有成交记录</div>';
var rl="";records.slice().reverse().forEach(function(r){var line=(r.actual>0)?("收购 ¥"+fmt(r.buy)+" · 卖出 ¥"+fmt(r.actual)+" · 持有 "+r.days+" 天"):"未收（避坑）";rl+='<div class="record"><div class="top"><b>'+esc(r.model)+'</b><span class="mini-badge '+V_CLS[r.verdict]+'">'+V_TEXT[r.verdict]+'</span></div><div class="nums">'+line+' · '+esc(r.note)+'</div></div>';});$("recList").innerHTML=rl||'<div class="muted">暂无记录</div>';}
function importFile(kind){var el={samples:$("fSamples"),anchors:$("fAnchors"),knowledge:$("fKnowledge"),cases:$("fCases")}[kind];var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var txt=String(r.result);try{if(kind==="samples"){DATA.samples=JSON.parse(txt);}else if(kind==="anchors"){DATA.anchors=txt.split(/\r?\n/).slice(1).filter(Boolean).map(function(l){var c=l.split(",");return{model:c[0],storage:+c[1],sell_low:+c[2],sell_high:+c[3],days:+c[4],source:c[5]||"CSV"};});}else if(kind==="cases"){CASES=JSON.parse(txt);}else{DATA.knowledge=JSON.parse(txt);}alert("已导入 "+kind+" 数据");}catch(e){alert("文件格式不对："+e.message);}};r.readAsText(f,"utf-8");}
